<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>HukukApp — Uygulamayı indir</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 40%, #1C232B 0%, #12161B 60%, #0B0D10 100%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
    }
    .card { max-width: 420px; width: 100%; text-align: center; }
    .icon {
      width: 130px; height: 130px;
      border-radius: 30px;
      overflow: hidden;
      margin: 0 auto 28px;
      border: 1px solid #3A404B;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 60px rgba(200,255,61,0.22);
    }
    .icon img { width: 100%; height: 100%; display: block; }
    h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    h1 .accent { color: #C8FF3D; }
    .subtitle { font-size: 15px; color: #C6CDD6; opacity: 0.85; margin-bottom: 36px; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 24px;
      border: 3px solid rgba(200,255,61,0.25);
      border-top-color: #C8FF3D;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner[hidden] { display: none; }
    .status { font-size: 16px; font-weight: 500; opacity: 0.85; margin-bottom: 32px; }
    .buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .btn {
      display: inline-block;
      width: 100%;
      max-width: 300px;
      background: #C8FF3D;
      color: #0B0D10;
      padding: 16px 36px;
      border-radius: 14px;
      font-size: 16px; font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(200,255,61,0.22);
      transition: transform .15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    /* Ikincil buton — cihazin ana magazasi disindaki secenek icin */
    .btn.secondary {
      background: rgba(255,255,255,0.10);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: none;
    }
    .btn[hidden] { display: none; }
    .small { font-size: 13px; opacity: 0.5; margin-top: 28px; }
    .small a { color: rgba(255,255,255,0.7); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><img src="../assets/apps/hukukapp.png?v=4" alt="HukukApp" /></div>
    <h1>Hukuk<span class="accent">App</span></h1>
    <p class="subtitle">Belgeni tara · süreni gör · dilekçeni hazırla</p>
    <div class="spinner" id="spinner" hidden></div>
    <p class="status" id="status">Uygulamayı indirmek için mağazanızı seçin</p>
    <div class="buttons">
      <a class="btn" id="btn-play" href="https://play.google.com/store/apps/details?id=com.hukukapp.app">Google Play'de aç</a>
      <a class="btn" id="btn-appstore" href="https://apps.apple.com/app/id6763385784">App Store'da aç</a>
    </div>
    <p class="small"><a href="https://bykdgstudio.github.io/">Bykdg Studio</a></p>
  </div>
  <script>
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=com.hukukapp.app';
      var APPSTORE = 'https://apps.apple.com/app/id6763385784';

      var ua = navigator.userAgent || navigator.vendor || '';
      // iPadOS 13+ kendini Mac olarak tanitir; dokunmatik nokta sayisiyla ayirt edilir.
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);

      var spinner = document.getElementById('spinner');
      var status = document.getElementById('status');
      var btnPlay = document.getElementById('btn-play');
      var btnStore = document.getElementById('btn-appstore');

      // Mobil cihazlarda dogru magazaya otomatik yonlendir; digerini ikincil
      // buton olarak birak. Masaustunde/bilinmeyen platformda yonlendirme yok,
      // iki secenek de esit gosterilir (yanlis magazaya atmaktan iyidir).
      if (isIOS || isAndroid) {
        var target = isIOS ? APPSTORE : PLAY;
        (isIOS ? btnPlay : btnStore).classList.add('secondary');
        status.textContent = isIOS
          ? 'App Store’a yönlendiriliyorsunuz…'
          : 'Google Play’e yönlendiriliyorsunuz…';
        spinner.hidden = false;
        setTimeout(function () { window.location.replace(target); }, 600);
      }
    })();
  </script>
</body>
</html>
